services:
  app:
    build: .
    volumes:
      - .:/app
    environment:
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_DATABASE: scheduler
      DB_USERNAME: root
    depends_on:
      mysql:
        condition: service_healthy
    # The demo worker: runs the due tasks at the start of every minute.
    command: php demo/artisan schedule:work

  mysql:
    image: mysql:8.4
    environment:
      # Local throwaway database: no port is published, so it is reachable only from "app".
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: scheduler
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 3s
      timeout: 3s
      retries: 20
